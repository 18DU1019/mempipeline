[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mempipeline"
version = "0.2.0"
description = "1-writer + N-contributors + unlimited-readers shared memory write pipeline: atomic idempotent writes, pluggable audit, staging ingest gate."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "素也设计工作室" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["memory", "agent", "pipeline", "audit", "idempotent", "staging"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.scripts]
mempipeline-ingest = "mempipeline.ingest:main"

[tool.setuptools.packages.find]
include = ["mempipeline*"]
